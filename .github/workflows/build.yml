name: Build YouMod
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
   
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YouMod & Extract Dylibs
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          path: YouMod

      - name: Install dependencies
        run: brew install make ldid dpkg

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Get Theos commit
        run: |
          get_commit_hash() {
            local repo_url=$1
            git ls-remote "$repo_url" HEAD | awk '{print substr($1,1,7)}'
          }
          echo "THEOS_COMMIT=$(get_commit_hash "https://github.com/roothide/theos")" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v6
        with:
          path: theos
          key: YouMod-26.5-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
            git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
            git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
            cd iOS-SDKs
            git sparse-checkout set --no-cone iPhoneOS26.5.sdk
            git checkout --quiet
            mv *.sdk "$THEOS/sdks"
            
      - name: Clone headers
        run: |
          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          else
            cd $THEOS/include/YouTubeHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi
          
          if [ ! -d "$THEOS/include/PSHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          else
            cd $THEOS/include/PSHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi

      - name: Fix Theos od broken pipe issue
        run: sed -i '' 's/od -c "$i" | head/od -c "$i" 2>\/dev\/null | head/g' $THEOS/bin/convert_xml_plist.sh || true

      - name: Build and Extract Dylibs
        run: |
          cd YouMod
          VERSION=$(grep '^Version:' control | cut -d ' ' -f2)
          echo "YOUMOD_VERSION=$VERSION" >> $GITHUB_ENV
          
          # دالة لبناء الحزمة واستخراج ملف الـ dylib وتسميته بالشكل المطلوب
          build_and_extract() {
            local scheme=$1
            local arch_suffix=$2
            
            make clean package DEBUG=0 FINALPACKAGE=1 ${scheme:+THEOS_PACKAGE_SCHEME=$scheme}
            
            # العثور على ملف deb الناتج
            DEB_FILE=$(ls packages/*.deb | head -n 1)
            if [ -z "$DEB_FILE" ]; then
              echo "Error: No deb file found!"
              exit 1
            }
            
            # فك حزمة الـ deb مؤقتاً لاستخراج ملف الـ dylib وباقي الملفات (مثل الـ bundle)
            mkdir -p temp_extracted
            dpkg-deb -x "$DEB_FILE" temp_extracted
            
            # البحث عن ملف dylib داخل الحزمة المفكوكة ونقله للمجلد الرئيسي مع الاسم الجديد
            FOUND_DYLIB=$(find temp_extracted -name "*.dylib" | head -n 1)
            if [ -n "$FOUND_DYLIB" ]; then
              cp "$FOUND_DYLIB" "${{ github.workspace }}/dylib.youmod_${VERSION}_${arch_suffix}.dylib"
            else
              echo "Warning: .dylib not found inside $DEB_FILE"
            fi
            
            rm -rf temp_extracted
            make clean
          }
          
          # البناء لمعماريات ومخططات مختلفة (يمكنك تعديل اللاحقة حسب رغبتك)
          # مثال: arm64e, arm64, arm
          build_and_extract "" "iphoneos-arm64e"
          build_and_extract "rootless" "iphoneos-arm64"
          build_and_extract "roothide" "iphoneos-arm"
          
          cd ..
          
          # ضغط ملفات المشروع كاملة (بما فيها الكود المصدري وYouMod.bundle وملفات التكوين)
          zip -r YouMod_Source_and_Project_${VERSION}.zip YouMod -x "YouMod/.git/*"
          mv YouMod_Source_and_Project_${VERSION}.zip ${{ github.workspace }}/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
         name: YouMod v${{ env.YOUMOD_VERSION }} Package & Dylibs
         path: |
           ${{ github.workspace }}/dylib.youmod_*.dylib
           ${{ github.workspace }}/YouMod_Source_and_Project_*.zip
         if-no-files-found: error
         overwrite: true

      - name: Create a draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.YOUMOD_VERSION }}
          name: v${{ env.YOUMOD_VERSION }} 
          files: |
            dylib.youmod_*.dylib
            YouMod_Source_and_Project_*.zip
          draft: true
